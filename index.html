/* V3 — refonte visuelle premium, sans dépendance externe */

/* Premium UI polish — shared design system */
:root{--surface-1:#151f29;--surface-2:#101820;--surface-3:#0c131a;--line-soft:#283744;--accent-glow:#c5ff4a20}
html{scroll-behavior:smooth}
body{background:radial-gradient(ellipse at 50% -18%,#1a2b2c 0%,#0b1117 44%,#090d12 78%);background-attachment:fixed}
header{background:rgba(9,13,18,.88);border-bottom-color:#25333f;box-shadow:0 8px 24px #0002}
header h1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
header h1 .tag{font-size:9px;letter-spacing:.09em;padding:4px 7px;border-radius:7px}
nav button{position:relative;transition:color .18s,background .18s}
nav button:hover{color:var(--ink);background:#ffffff06}
nav button.on{background:linear-gradient(180deg,transparent,#c5ff4a08)}
nav button.on:after{content:"";position:absolute;left:22%;right:22%;bottom:-2px;height:2px;background:var(--b);border-radius:3px;box-shadow:0 0 12px #c5ff4a55}
main{padding-top:20px}
.card{position:relative;overflow:hidden;border-color:var(--line-soft);border-radius:18px;background:linear-gradient(145deg,rgba(23,33,43,.97),rgba(15,22,30,.98) 75%);box-shadow:0 8px 26px #00000012;transition:border-color .18s,box-shadow .18s}
.card h2{display:flex;align-items:center;gap:8px;line-height:1.35}
.card:focus-within{border-color:#c5ff4a48}
.metric{border:1px solid #2b3a46;border-radius:14px;background:linear-gradient(145deg,#19252e,#121a22)}
.li{border-color:#283744}
.p,.x,.bnav button,.quick-action,.recent-food{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.p{border-radius:11px;transition:transform .14s,border-color .14s,background .14s,filter .14s}
.p:not(:disabled):active{transform:scale(.985)}
.p.secondary{border-color:#334552;background:#131d26}
.p.secondary:hover{border-color:#637887;background:#1a2731}
.p:focus-visible,.x:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.body-zone:focus-visible{outline:2px solid var(--b);outline-offset:2px}
input,select,textarea{border-color:#30414f;background:#0c131a;transition:border-color .16s,box-shadow .16s}
input:focus,select:focus,textarea:focus{border-color:#b5ee43;box-shadow:0 0 0 3px #c5ff4a12;outline:none}
.tag{border-radius:8px}
.bar{background:#25333d;border-radius:99px;overflow:hidden}
.bar i{border-radius:99px;transition:width .35s ease}
.big,.bt-mini b,.metric b{font-variant-numeric:tabular-nums}
.bt-snapshot{background:radial-gradient(ellipse at 100% 0%,#c5ff4a0a,transparent 55%),linear-gradient(145deg,#17232c,#10171f)}
.bt-mini{background:#0e161e;border-color:#2b3a46;transition:border-color .18s,transform .18s}
.bt-mini:hover{border-color:#516270;transform:translateY(-1px)}
.bt-mini b{line-height:1.15}
.body-map{filter:drop-shadow(0 10px 18px #0002)}
.body-zone{transition:fill .18s,filter .18s,opacity .18s}
.body-zone:hover,.body-zone:focus{fill:#80cbb6;filter:drop-shadow(0 0 4px #42d6a455)}
.body-zone.is-selected{filter:drop-shadow(0 0 6px #b7f34a40)}
.rest-range{border-color:#34434e;border-radius:13px;background:#0f171f}
.ex-guide-row{border:1px solid #293844!important;border-radius:16px!important;background:linear-gradient(145deg,#151f28,#10171f)!important}
.ex-art{border:1px solid #30414b;background:radial-gradient(circle at 50% 35%,#2a4145,#15212a 72%);transition:transform .18s,border-color .18s}
.ex-guide-row:hover .ex-art{border-color:#56736c;transform:translateY(-1px)}
.ex-name{letter-spacing:-.025em;line-height:1.3}
.ex-visual-copy p{line-height:1.55}
.quick-action{box-shadow:0 4px 12px #00000010}
.quick-action:focus-visible{outline-offset:3px}
.quick-action.primary{box-shadow:0 5px 18px #c5ff4a10}
.recent-food{transition:border-color .16s,background .16s}
.recent-food:hover{border-color:#8bb63c;background:#17231c}
.quick-grams .p{border-radius:10px}
.nutrition-picked{box-shadow:0 6px 22px #0002}
.nutrition-add{box-shadow:0 5px 16px #c5ff4a12}
details.ux-fold{border-color:#2b3b47;border-radius:14px}
details.ux-fold>summary{padding:14px 15px}
details.ux-fold[open]>summary{border-bottom:1px solid #263641;color:var(--b)}
#toast{border:1px solid #40515d;border-radius:13px;box-shadow:0 12px 34px #0005;backdrop-filter:blur(14px)}
.fab{box-shadow:0 10px 24px #0005,0 0 0 5px #c5ff4a0c;transition:transform .16s,box-shadow .16s}
.fab:active{transform:scale(.96)}
@media(min-width:701px){main{padding-top:26px}.card{padding:19px}.card:hover{border-color:#354753}}
@media(max-width:700px){
 body{background:radial-gradient(ellipse at 50% -12%,#172626 0%,#0b1117 48%,#090d12 85%)}
 header{padding-top:calc(12px + env(safe-area-inset-top))}
 header h1{font-size:19px}
 main{padding:13px 11px 110px}
 .card{padding:14px;border-radius:16px;margin-bottom:11px}
 .bnav{box-shadow:0 -10px 30px #0003}
 .bnav button{min-height:54px;border-radius:12px}
 .bnav button.on{box-shadow:inset 0 0 0 1px #c5ff4a15}
 .quick-actions{gap:7px}
 .quick-action{min-height:63px}
 .bt-mini{padding:11px}
 .ex-guide-row{padding:11px!important}
 .ex-art{border-radius:12px}
 .fab{bottom:calc(78px + env(safe-area-inset-bottom));right:13px;width:50px;height:50px}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.card,.bt-mini,.ex-art,.p,.fab{transition:none}}


/* Muscle recovery overview */
.recovery-overview{margin-top:18px;padding-top:17px;border-top:1px solid #293944}
.recovery-overview h3{font-size:16px;margin:4px 0 0;letter-spacing:-.02em}
.recovery-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:12px}
.recovery-card{display:flex;min-width:0;flex-direction:column;align-items:stretch;gap:7px;padding:11px;border:1px solid #2a3945;border-radius:13px;background:linear-gradient(145deg,#151f28,#0f171f);color:var(--ink);text-align:left;cursor:pointer;transition:border-color .16s,transform .16s,background .16s}
.recovery-card:hover{border-color:#586b77;transform:translateY(-1px)}
.recovery-card.selected{border-color:#c5ff4a9c;background:linear-gradient(145deg,#1c2b23,#111b20);box-shadow:inset 0 0 0 1px #c5ff4a12}
.recovery-card-top{display:flex;align-items:center;justify-content:space-between;gap:5px}
.recovery-card-top b{font-size:12px;line-height:1.2}
.recovery-dot{display:block;flex:0 0 7px;width:7px;height:7px;border-radius:50%;background:#75818a}
.recovery-card.ready .recovery-dot{background:#b9ef4b;box-shadow:0 0 9px #b9ef4b33}
.recovery-card.rest .recovery-dot{background:#ffb65c}
.recovery-card.window .recovery-dot{background:#6db9e8}
.recovery-card strong{font-size:13px;line-height:1.25}
.recovery-card small{font-size:10px;line-height:1.35;color:var(--muted)}
.recovery-card-foot{padding-top:6px;border-top:1px solid #293944;font-size:10px;color:var(--muted)}
.recovery-footnote{font-size:10px;line-height:1.5;color:var(--muted);margin:10px 0 0}
@media(max-width:900px){.recovery-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:480px){.recovery-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.recovery-card{padding:10px;gap:6px}.recovery-card strong{font-size:12px}.recovery-card small,.recovery-card-foot{font-size:9px}}

/* Detailed anatomy illustration polish */
.body-visual-panel{background:radial-gradient(ellipse at 50% 20%,#1d2c35 0%,#111a22 54%,#0d141b 100%);border-color:#30414e;box-shadow:inset 0 1px 0 #ffffff05}
.body-map{max-width:290px;overflow:visible}
.body-base{fill:#293744;stroke:#71828d;stroke-width:1.35;stroke-linejoin:round}
.body-zone{fill:#405664;stroke:#111b23;stroke-width:1.25;vector-effect:non-scaling-stroke}
.body-zone:hover,.body-zone:focus{fill:#7db4a8;filter:drop-shadow(0 0 3px #65bba555)}
.body-zone.is-selected{fill:#50d9ad;stroke:#d5ff79;stroke-width:1.8;filter:drop-shadow(0 0 5px #b7f34a40)}
.body-contours{fill:none;stroke:#92a7b0;stroke-width:.8;stroke-linecap:round;stroke-linejoin:round;opacity:.42;pointer-events:none}
.body-labels{fill:#e0e9e8;opacity:.65;font-size:5.6px;font-weight:800;letter-spacing:.55px;text-anchor:middle;pointer-events:none}
.body-legend{max-width:260px;margin:0 auto}

EXS=LIB.map(x=>x.n);
const GRX=[[/leg extension|extension jambes|quadriceps|presse|squat|fente|jambe/,'Quadriceps'],[/curl|biceps/,'Biceps'],[/triceps|extension|dips/,'Triceps'],[/mollet/,'Mollets'],[/ischio|leg curl|souleve/,'Ischios'],[/fessier|hip|pont/,'Fessiers'],[/pec|couche|pompe|ecart|developpe|chest press/,'Pectoraux'],[/epaule|militaire|lateral|oiseau/,'Épaules'],[/tirage|row|tract|dos|pull|high row/,'Dos'],[/abdo|crunch|gainage|planche/,'Abdos']];
const grpOf=ex=>{const q=fold(ex);if(!q)return 'Autre';const a=LIB.find(x=>fold(x.n)===q)||LIB.find(x=>fold(x.n).includes(q)||q.includes(fold(x.n)));if(a)return a.g;const b=GRX.find(([re])=>re.test(q));return b?b[1]:'Autre'};
let libG='',libQ='';
const libFilter=()=>{const q=fold(libQ);return LIB.filter(x=>(!libG||x.g===libG)&&(!q||fold(x.n).includes(q)))};
const libList=L=>L.length?L.slice(0,40).map(x=>'<button type="button" class="li qsb" data-n="'+esc(x.n)+'" onclick="pickEx(this.dataset.n)"><span class="lib-eq-icon"><b>'+({'M':'▥','H':'⏣','B':'━','P':'↕','C':'●'}[x.e]||'•')+'</b><span>'+esc(x.n)+'<br><span class="mu">'+x.g+' · '+EQ[x.e]+'</span></span></span><span class="mu">+</span></button>').join(''):'<p class="mu">Aucun exercice trouvé.</p>';
function libRender(){const e=$('#libl');if(e)e.innerHTML=libList(libFilter())}
function pickEx(nm){const f=$('#setForm');if(!f)return;f.ex.value=nm;hintSet(f.ex);f.kg.focus();f.scrollIntoView({behavior:'smooth',block:'center'});toast(nm+' : prêt à saisir')}
function vLib(){return `<div class="card"><h2>Bibliothèque d'exercices</h2><div class="actions"><button class="p sm ${libG?'secondary':''}" onclick="libG='';render()">Tous</button>${Object.keys(LIBS).map(g=>`<button class="p sm ${libG===g?'':'secondary'}" data-g="${g}" onclick="libG=this.dataset.g;render()">${g}</button>`).join('')}</div><label style="margin-top:8px">Rechercher<input value="${esc(libQ)}" oninput="libQ=this.value;libRender()" placeholder="Ex. curl, squat, pec deck…"></label><div id="libl">${libList(libFilter())}</div><p class="mu">${LIB.length} exercices. Touche-en un pour le préparer dans le carnet.</p></div>`}
function vWeek(){const a=dstr(6),W=S.sets.filter(x=>x.d>=a&&x.d<=localDate()),by={};W.forEach(x=>{const g=grpOf(x.ex);by[g]=(by[g]||0)+x.sets});const days=new Set(W.map(x=>x.d)).size,wg=n(S.p.wg)||4,td=daySets(),prs=td.filter(x=>{const o=S.sets.filter(y=>y.ex===x.ex&&y.d<x.d);return o.length>0&&e1(x)>Math.max(...o.map(e1))}).length,hit=[...new Set(td.map(x=>grpOf(x.ex)))];
 const bars=Object.keys(LIBS).map(g=>{const c=by[g]||0;return `<div style="margin-top:8px"><div class="split mu"><span>${g}</span><span><b style="color:var(--ink)">${c}</b> séries</span></div><div class="bar" style="margin:4px 0 0"><i style="width:${Math.min(100,c/20*100)}%;background:${c>=10?'var(--m)':c>0?'var(--b)':'var(--line)'}"></i></div></div>`}).join('');
 return `<div class="card"><div class="split"><h2>Ta semaine</h2><span class="tag">${days} / ${wg} séances</span></div><div class="bar"><i style="width:${Math.min(100,days/wg*100)}%"></i></div>${td.length?`<p class="mu">Aujourd'hui : ${hit.join(', ')}${prs?` · ${prs} record${prs>1?'s':''}`:''}.</p>`:''}<details open><summary class="mu" style="cursor:pointer;padding:6px 0">Volume par muscle sur 7 jours (repère : 10 à 20 séries par muscle et par semaine)</summary>${bars}${by.Autre?`<p class="mu">Autres exercices : ${by.Autre} séries.</p>`:''}</details></div>`}
function toolWarm(x){const w=n(x),e=$('#tw'),ro=z=>Math.max(0,Math.round(z/2.5)*2.5);if(!e)return;if(!ok(w)||w<=0){e.textContent='Entre ta charge de travail pour obtenir les séries d\'échauffement.';return}e.innerHTML=[[.4,8],[.6,5],[.8,3],[.9,1]].map(([p,rp])=>`<div class="li"><span>${Math.round(p*100)} %</span><b>${r(ro(w*p),1)} kg × ${rp}</b></div>`).join('')+`<p class="mu">Puis tes séries de travail à ${r(w,1)} kg. Ajoute 1 série à vide ou à la barre × 10 si besoin.</p>`}
function toolPlates(){const t=n($('#pk1').value),bar=n($('#pk2').value),e=$('#tp');if(!e)return;if(!ok(t)||!ok(bar)||t<=bar){e.textContent='La charge visée doit dépasser le poids de la barre.';return}let side=(t-bar)/2;const out=[];[25,20,15,10,5,2.5,1.25].forEach(p=>{const c=Math.floor(side/p+1e-9);if(c){out.push(`${c} × ${String(p).replace('.',',')} kg`);side-=c*p}});e.innerHTML=`Par côté : <b style="color:var(--ink)">${out.join(' + ')||'aucun disque'}</b>${side>.01?`<br>Impossible à charger exactement : charge réelle ${r(t-side*2,2)} kg.`:''}`}
function tool1rm(ex){const e=$('#t1');if(!e)return;const L=S.sets.filter(x=>x.ex===ex);if(!L.length){e.textContent='';return}const b=Math.max(...L.map(e1));e.innerHTML=`<p class="mu">Meilleur 1RM estimé : ${r(b,1)} kg</p>`+[[95,2],[90,4],[85,6],[80,8],[75,10],[70,12],[60,15]].map(([p,rp])=>`<div class="li"><span>${p} % · environ ${rp} reps</span><b>${r(Math.round(b*p/100/2.5)*2.5,1)} kg</b></div>`).join('')}
function vTools(){const u=[...new Set(S.sets.map(x=>x.ex))];return `<div class="card"><h2>Outils de salle</h2><details><summary class="mu" style="cursor:pointer;padding:6px 0">Échauffement progressif</summary><label>Charge de travail (kg)<input type="number" min="1" step="0.5" oninput="toolWarm(this.value)"></label><div id="tw" class="mu" style="margin-top:8px"></div></details><details><summary class="mu" style="cursor:pointer;padding:6px 0">Calculateur de disques</summary><div class="row"><label>Charge visée (kg)<input id="pk1" type="number" min="1" step="0.5" oninput="toolPlates()"></label><label>Barre (kg)<input id="pk2" type="number" min="0" step="0.5" value="20" oninput="toolPlates()"></label></div><div id="tp" class="mu" style="margin-top:8px"></div></details><details><summary class="mu" style="cursor:pointer;padding:6px 0">Pourcentages de ton 1RM</summary><label>Exercice<select onchange="tool1rm(this.value)"><option value="">Choisir</option>${u.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select></label><div id="t1" class="mu" style="margin-top:8px"></div></details></div>`}
let tx0=0,ty0=0;document.addEventListener('touchstart',e=>{const t=e.changedTouches[0];tx0=t.clientX;ty0=t.clientY},{passive:true});
document.addEventListener('touchend',e=>{if(tab!=='jour'||(e.target.closest&&e.target.closest('input,select,textarea,svg,details,button')))return;const t=e.changedTouches[0],dx=t.clientX-tx0,dy=t.clientY-ty0;if(Math.abs(dx)>90&&Math.abs(dy)<45)shiftDay(dx<0?1:-1)},{passive:true});
const TABS=[['jour',"Aujourd'hui"],['mes','Mesures'],['cardio','Cardio'],['force','Musculation'],['recettes','Recettes'],['evo','Évolution'],['cal','Calendrier'],['ph','Photos'],['pro','Profil']];
let uxOpenSections={};
function render(){document.querySelectorAll('main details[data-ux-key][open]').forEach(d=>uxOpenSections[d.dataset.uxKey]=true);const same=tab===lastTab,y=same?window.scrollY:0,snap=KEEP&&same?[...document.querySelectorAll('main [name]')].filter(e=>e.value&&e.form&&e.type!=='date').map(e=>[e.form.id||'',e.name,e.value]):[];KEEP=0;lastTab=tab;$('#app').innerHTML=`<header><h1>Suivi Forme <span class="tag">V10 · PERFORMANCE</span></h1><nav>${TABS.map(([k,l])=>`<button class="${k===tab?'on':''}" onclick="tab='${k}';render()">${l}</button>`).join('')}</nav></header><main>${({jour:vJour,mes:vMes,force:vForce,recettes:vRecettes,cardio:vCardio,evo:vEvo,cal:vCalendrier,ph:vPh,pro:vPro,plus:vPlus}[tab]||vJour)()}</main>${bnav()}${tab==='jour'?'<button class="fab" aria-label="Ajouter un aliment" onclick="fabGo()">+</button>':''}`;document.querySelectorAll('main details[data-ux-key]').forEach(d=>{if(uxOpenSections[d.dataset.uxKey])d.open=true});snap.forEach(([fi,nm,v])=>{const e=[...document.querySelectorAll('main [name="'+nm+'"]')].find(x=>x.form&&(x.form.id||'')===fi);if(e&&!e.value&&e.tagName!=='SELECT')e.value=v});window.scrollTo(0,y);if(QS&&$('#qsr'))qsDraw();if(tab==='ph')loadPhotos()}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
try{if("serviceWorker"in navigator&&location.protocol.indexOf("http")===0)navigator.serviceWorker.register("sw.js")}catch(e){}
render();
</script></body></html>
